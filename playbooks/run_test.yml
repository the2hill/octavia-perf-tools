---
- name: Load benchmark target
  hosts: localhost
  gather_facts: false
  vars:
    root_dir: "{{ playbook_dir }}/.."
  tasks:
    - name: Ensure controller can reach current master FIP
      ansible.builtin.include_tasks: tasks/ensure_controller_master_route.yml
    - name: Read target state
      ansible.builtin.include_vars:
        file: "{{ root_dir }}/state/current_target.yml"
        name: target_state
    - name: Add target state to runtime host
      ansible.builtin.add_host:
        name: runtime_target
        target_state: "{{ target_state }}"

- name: Constrain FIP benchmark routes to the external-network MTU
  hosts: master:locust_workers
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
    route_state_file: "/var/lib/octavia-perf/fip-route-{{ target.target_host }}.json"
  tasks:
    - name: Install narrow route for floating-IP target
      ansible.builtin.command:
        argv:
          - /opt/octavia-perf/controller_fip_route.py
          - ensure
          - --destination
          - "{{ target.target_host }}"
          - --mtu
          - "{{ target.external_network_mtu | default(1500) | string }}"
          - --state-file
          - "{{ route_state_file }}"
      become: true
      changed_when: true
      when: (target.traffic_path | default('tenant_vip')) == 'floating_ip'

- name: Verify target before benchmark
  hosts: master
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
  tasks:
    - name: Wait for target response before benchmark
      ansible.builtin.uri:
        url: "{{ target.target_url }}{{ backend.health_path }}"
        status_code: 200
        timeout: 5
        validate_certs: "{{ not (target.scheme == 'https' and (tls.client_insecure | default(true) | bool)) }}"
      register: target_ready
      retries: 12
      delay: 2
      until: target_ready.status | default(0) == 200

- name: Start metrics sampling everywhere
  hosts: benchmark_nodes
  gather_facts: false
  vars:
    remote_result_dir: "/var/lib/octavia-perf/results/{{ hostvars['runtime_target'].target_state.benchmark_id }}"
  tasks:
    - name: Create result directory
      ansible.builtin.file:
        path: "{{ remote_result_dir }}"
        state: directory
        mode: '0755'
      become: true
    - name: Stop stale metrics sampler
      ansible.builtin.shell: "pkill -f '[m]etrics_sampler.py' || true"
      changed_when: false
      become: true
    - name: Start metrics sampler
      ansible.builtin.shell: >-
        nohup /opt/octavia-perf/metrics_sampler.py
        --output {{ remote_result_dir }}/metrics.csv
        --interval {{ metrics.sample_interval_seconds }}
        >/dev/null 2>&1 &
      changed_when: true
      become: true

- name: Start distributed Locust workers
  hosts: locust_workers
  gather_facts: false
  vars:
    master_ip: "{{ hostvars[groups['master'][0]].private_ip }}"
    target: "{{ hostvars['runtime_target'].target_state }}"
    max_rps_json: "{{ max_rps | default({}) | to_json }}"
  tasks:
    - name: Stop stale worker processes
      ansible.builtin.shell: "pkill -f '[l]ocust.*--worker' || true"
      changed_when: false
      become: true
      when: (target.benchmark_engine | default('locust')) == 'locust'
    - name: Start worker processes

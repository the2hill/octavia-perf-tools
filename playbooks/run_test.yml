---
- name: Load benchmark target
  hosts: localhost
  gather_facts: false
  vars:
    root_dir: "{{ playbook_dir }}/.."
  tasks:
    - name: Ensure controller can reach current master FIP
      ansible.builtin.include_tasks: tasks/ensure_controller_master_route.yml
    - name: Read target state
      ansible.builtin.include_vars:
        file: "{{ root_dir }}/state/current_target.yml"
        name: target_state
    - name: Add target state to runtime host
      ansible.builtin.add_host:
        name: runtime_target
        target_state: "{{ target_state }}"
- name: Constrain FIP benchmark routes to the external-network MTU
  hosts: master:locust_workers
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
    route_state_file: "/var/lib/octavia-perf/fip-route-{{ target.target_host }}.json"
  tasks:
    - name: Install narrow route for floating-IP target
      ansible.builtin.command:
        argv:
          - /opt/octavia-perf/controller_fip_route.py
          - ensure
          - --destination
          - "{{ target.target_host }}"
          - --mtu
          - "{{ target.external_network_mtu | default(1500) | string }}"
          - --state-file
          - "{{ route_state_file }}"
      become: true
      changed_when: true
      when: (target.traffic_path | default('tenant_vip')) == 'floating_ip'
- name: Verify target before benchmark
  hosts: master
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
  tasks:
    - name: Wait for target response before benchmark
      ansible.builtin.uri:
        url: "{{ target.target_url }}{{ backend.health_path }}"
        status_code: 200
        timeout: 5
        validate_certs: "{{ not (target.scheme == 'https' and (tls.client_insecure | default(true) | bool)) }}"
      register: target_ready
      retries: 12
      delay: 2
      until: target_ready.status | default(0) == 200
- name: Start metrics sampling everywhere
  hosts: benchmark_nodes
  gather_facts: false
  vars:
    remote_result_dir: "/var/lib/octavia-perf/results/{{ hostvars['runtime_target'].target_state.benchmark_id }}"
  tasks:
    - name: Create result directory
      ansible.builtin.file:
        path: "{{ remote_result_dir }}"
        state: directory
        mode: '0755'
      become: true
    - name: Stop stale metrics sampler
      ansible.builtin.shell: "pkill -f '[m]etrics_sampler.py' || true"
      changed_when: false
      become: true
    - name: Start metrics sampler
      ansible.builtin.shell: >-
        nohup /opt/octavia-perf/metrics_sampler.py
        --output {{ remote_result_dir }}/metrics.csv
        --interval {{ metrics.sample_interval_seconds }}
        >/dev/null 2>&1 &
      changed_when: true
      become: true
- name: Start distributed Locust workers
  hosts: locust_workers
  gather_facts: false
  vars:
    master_ip: "{{ hostvars[groups['master'][0]].private_ip }}"
    target: "{{ hostvars['runtime_target'].target_state }}"
    max_rps_json: "{{ max_rps | default({}) | to_json }}"
  tasks:
    - name: Stop stale worker processes
      ansible.builtin.shell: "pkill -f '[l]ocust.*--worker' || true"
      changed_when: false
      become: true
      when: (target.benchmark_engine | default('locust')) == 'locust'
    - name: Start worker processes
      ansible.builtin.shell: |
        set -euo pipefail
        export OCTAVIA_PERF_PATH={{ target.benchmark_path | quote }}
        export OCTAVIA_PERF_TIMEOUT={{ locust.request_timeout_seconds | quote }}
        export OCTAVIA_PERF_CONNECTION_MODE={{ target.connection_mode | quote }}
        export OCTAVIA_PERF_LOCUST_PROFILE={{ target.locust_profile | default('staircase') | quote }}
        export OCTAVIA_PERF_MAX_RPS={{ max_rps_json | quote }}
        export OCTAVIA_PERF_TLS_INSECURE={{ (tls.client_insecure | default(true) | bool) | ternary('true', 'false') | quote }}
        nohup /opt/octavia-perf/venv/bin/locust \
          -f /opt/octavia-perf/locustfile.py \
          --worker \
          --master-host {{ master_ip }} \
          --processes {{ vm.locust.processes_per_vm }} \
          >/var/log/octavia-perf-worker.log 2>&1 &
      args:
        executable: /bin/bash
      changed_when: true
      become: true
      when: (target.benchmark_engine | default('locust')) == 'locust'
- name: Run Locust master headlessly
  hosts: master
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
    remote_result_dir: "/var/lib/octavia-perf/results/{{ target.benchmark_id }}"
    total_workers: "{{ (vm.locust.worker_vms | int) * (vm.locust.processes_per_vm | int) }}"
    stages_json: "{{ locust.stages | to_json }}"
    max_rps_json: "{{ max_rps | default({}) | to_json }}"
  tasks:
    - name: Run Locust master
      ansible.builtin.shell: |
        set -euo pipefail
        export OCTAVIA_PERF_PATH={{ target.benchmark_path | quote }}
        export OCTAVIA_PERF_STAGES={{ stages_json | quote }}
        export OCTAVIA_PERF_TIMEOUT={{ locust.request_timeout_seconds | quote }}
        export OCTAVIA_PERF_CONNECTION_MODE={{ target.connection_mode | quote }}
        export OCTAVIA_PERF_LOCUST_PROFILE={{ target.locust_profile | default('staircase') | quote }}
        export OCTAVIA_PERF_MAX_RPS={{ max_rps_json | quote }}
        export OCTAVIA_PERF_MAX_RPS_OUTPUT={{ (remote_result_dir + '/max-rps-stages.csv') | quote }}
        export OCTAVIA_PERF_TLS_INSECURE={{ (tls.client_insecure | default(true) | bool) | ternary('true', 'false') | quote }}
        /opt/octavia-perf/venv/bin/locust \
          -f /opt/octavia-perf/locustfile.py \
          --master \
          --headless \
          --expect-workers {{ total_workers }} \
          --host {{ target.target_url | quote }} \
          --stop-timeout {{ locust.stop_timeout_seconds }} \
          --csv {{ remote_result_dir }}/locust \
          --csv-full-history \
          >{{ remote_result_dir }}/locust.log 2>&1
      args:
        executable: /bin/bash
      become: true
      register: locust_master_run
      failed_when: locust_master_run.rc not in [0, 1]
      changed_when: true
      when: (target.benchmark_engine | default('locust')) == 'locust'
    - name: Report Locust completion status
      ansible.builtin.debug:
        msg: >-
          Locust completed with rc={{ locust_master_run.rc }}.
          {{ 'Request failures/errors were recorded; result collection will continue.' if locust_master_run.rc == 1 else 'No Locust failure exit code was reported.' }}
      when:
        - (target.benchmark_engine | default('locust')) == 'locust'
        - locust_master_run is defined
# Connection-capacity execution is validated from actual distributed worker output.
# Do not run a separate single-connection preflight: it can reject a valid
# capacity test before any measurable worker results are generated.
- name: Prepare synchronized connection-capacity start
  hosts: localhost
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
  tasks:
    - name: Set a common future start epoch for all capacity processes
      ansible.builtin.add_host:
        name: runtime_target
        target_state: "{{ target }}"
        connection_start_epoch: >-
          {{ (lookup('pipe', 'date +%s') | int) + ((connection_capacity | default({})).sync_start_delay_seconds | default(8) | int) }}
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
- name: Start connection-capacity level coordinator
  hosts: master
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
    remote_result_dir: "/var/lib/octavia-perf/results/{{ target.benchmark_id }}"
    capacity_coordinator_port: "{{ connection_capacity.coordinator_port | default(5557) | int }}"
    capacity_coordinator_timeout: "{{ connection_capacity.barrier_timeout_seconds | default(900) | int }}"
    capacity_total_processes: "{{ (vm.locust.worker_vms | int) * (connection_capacity.processes_per_vm | default(2) | int) }}"
  tasks:
    - name: Install capacity level coordinator
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../roles/locust/files/capacity_coordinator.py"
        dest: /opt/octavia-perf/capacity_coordinator.py
        owner: root
        group: root
        mode: "0755"
      become: true
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Stop stale capacity coordinator
      ansible.builtin.shell: |
        set -euo pipefail
        if pgrep -af '[c]apacity_coordinator.py' >/dev/null; then
          pkill -f '[c]apacity_coordinator.py' || true
          sleep 1
        fi
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Wait for stale coordinator listener to stop
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ capacity_coordinator_port | int }}"
        timeout: 10
        state: stopped
      become: true
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Start capacity level coordinator
      ansible.builtin.shell: |
        set -euo pipefail
        nohup /opt/octavia-perf/capacity_coordinator.py \
          --bind 0.0.0.0 \
          --port {{ capacity_coordinator_port }} \
          --run-id {{ target.benchmark_id | quote }} \
          --worker-count {{ capacity_total_processes }} \
          --barrier-timeout-seconds {{ capacity_coordinator_timeout }} \
          --ready-file {{ (remote_result_dir + '/capacity-coordinator.ready') | quote }} \
          >{{ (remote_result_dir + '/capacity-coordinator.log') | quote }} 2>&1 &
        echo $! >/var/run/octavia-perf-capacity-coordinator.pid
      args:
        executable: /bin/bash
      become: true
      changed_when: true
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Wait for capacity coordinator listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ capacity_coordinator_port | int }}"
        timeout: 15
        state: started
      become: true
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
- name: Run distributed concurrent-connection capacity workers
  hosts: locust_workers
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
    remote_result_dir: "/var/lib/octavia-perf/results/{{ target.benchmark_id }}"
    levels_csv: "{{ connection_capacity.levels | map('string') | join(',') }}"
    max_levels_per_worker_csv: "{{ connection_capacity.max_levels_per_worker | default([]) | map('string') | join(',') }}"
    capacity_processes_per_vm: "{{ connection_capacity.processes_per_vm | default(2) | int }}"
    capacity_total_processes: "{{ (vm.locust.worker_vms | int) * (connection_capacity.processes_per_vm | default(2) | int) }}"
    capacity_vm_index: "{{ groups['locust_workers'].index(inventory_hostname) }}"
    capacity_coordinator_host: "{{ hostvars[groups['master'][0]].private_ip }}"
    capacity_coordinator_port: "{{ connection_capacity.coordinator_port | default(5557) | int }}"
    capacity_coordinator_timeout: "{{ connection_capacity.barrier_timeout_seconds | default(900) | int }}"
  tasks:
    - name: Install connection-capacity runner
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../roles/locust/files/connection_capacity.py"
        dest: /opt/octavia-perf/connection_capacity.py
        owner: root
        group: root
        mode: "0755"
      become: true
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Run capacity worker processes
      ansible.builtin.shell: |
        set -euo pipefail
        ulimit -n {{ connection_capacity.file_descriptor_limit | int }}
        pids=()
        if [[ {{ (target.capacity_profile | default('standard')) | quote }} == "max" ]]; then
          levels_csv=$(/usr/bin/python3 -c 'import sys; w=int(sys.argv[1]); print(",".join(str(int(x)*w) for x in sys.argv[2].split(",") if x))' {{ vm.locust.worker_vms | int }} {{ max_levels_per_worker_csv | quote }})
        else
          levels_csv={{ levels_csv | quote }}
        fi
        vm_index={{ capacity_vm_index | int }}
        processes={{ capacity_processes_per_vm | int }}
        total_processes={{ capacity_total_processes | int }}
        for ((p=0; p<processes; p++)); do
          shard=$((vm_index * processes + p))
          prefix=$(printf 'p%02d' "$p")
          cmd=(
            /opt/octavia-perf/connection_capacity.py
            --target-url {{ target.target_url | quote }}
            --path {{ target.benchmark_path | quote }}
            --capacity-mode {{ target.capacity_mode | quote }}
            --levels "$levels_csv"
            --worker-index "$shard"
            --worker-count "$total_processes"
            --ramp-seconds {{ connection_capacity.ramp_seconds | quote }}
            --hold-seconds {{ connection_capacity.hold_seconds | quote }}
            --heartbeat-seconds {{ connection_capacity.heartbeat_seconds | quote }}
            --inter-level-cooldown-seconds {{ connection_capacity.inter_level_cooldown_seconds | quote }}
            --connect-timeout {{ connection_capacity.connect_timeout_seconds | quote }}
            --request-timeout {{ connection_capacity.request_timeout_seconds | quote }}
            --open-concurrency {{ connection_capacity.open_concurrency_per_worker | quote }}
            --io-concurrency {{ connection_capacity.io_concurrency_per_worker | quote }}
            --start-epoch {{ hostvars['runtime_target'].connection_start_epoch | quote }}
            --output-dir {{ remote_result_dir | quote }}
            --output-prefix "$prefix"
            --coordinator-host {{ capacity_coordinator_host | quote }}
            --coordinator-port {{ capacity_coordinator_port | quote }}
            --coordinator-run-id {{ target.benchmark_id | quote }}
            --barrier-timeout-seconds {{ capacity_coordinator_timeout | quote }}
            --require-coordinator
          )
          {% if tls.client_insecure | default(true) | bool %}
          cmd+=(--insecure)
          {% endif %}
          {% if connection_capacity.abortive_close | default(true) | bool %}
          cmd+=(--abortive-close)
          {% endif %}
          {% if connection_capacity.verify_idle_at_end | default(true) | bool %}
          cmd+=(--verify-idle-at-end)
          {% endif %}
          {% if connection_capacity.tcp_nodelay | default(true) | bool %}
          cmd+=(--tcp-nodelay)
          {% endif %}
          printf 'capacity worker command:'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}" >{{ remote_result_dir }}/connection-capacity-${prefix}.log 2>&1 &
          pids+=("$!")
        done
        rc=0
        for idx in "${!pids[@]}"; do
          worker_rc=0
          wait "${pids[$idx]}" || worker_rc=$?
          printf '%s\n' "$worker_rc" >{{ remote_result_dir }}/connection-capacity-$(printf 'p%02d' "$idx").exitcode
          if (( worker_rc != 0 )); then rc=1; fi
        done
        exit "$rc"
      args:
        executable: /bin/bash
      become: true
      register: capacity_run
      failed_when: false
      changed_when: true
      when:
        - (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Persist capacity runner status
      ansible.builtin.copy:
        content: "{{ capacity_run.rc | default(1) }}\n"
        dest: "{{ remote_result_dir }}/capacity-runner.exitcode"
        mode: '0644'
      become: true
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Discover capacity worker result artifacts
      ansible.builtin.find:
        paths: "{{ remote_result_dir }}"
        patterns:
          - "connection-capacity-*.csv"
          - "connection-errors-*.csv"
          - "connection-capacity-*.log"
          - "connection-capacity-*.exitcode"
          - "capacity-runner.exitcode"
        file_type: file
        recurse: false
      register: capacity_artifacts
      become: true
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Fetch capacity worker result artifacts
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ playbook_dir }}/../results/{{ target.benchmark_id }}/raw/{{ inventory_hostname }}/{{ item.path | basename }}"
        flat: true
        fail_on_missing: false
      become: true
      loop: "{{ capacity_artifacts.files | default([]) }}"
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Publish capacity worker status for post-cleanup validation
      ansible.builtin.set_fact:
        capacity_worker_rc: "{{ capacity_run.rc | default(1) | int }}"
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Count capacity CSVs produced by this generator
      ansible.builtin.set_fact:
        capacity_csv_count: >-
          {{
            capacity_artifacts.files
            | default([])
            | map(attribute='path')
            | select('match', '.*/connection-capacity-p[0-9]+\.csv$')
            | list
            | length
          }}
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
- name: Stop samplers and workers
  hosts: benchmark_nodes
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
    remote_result_dir: "/var/lib/octavia-perf/results/{{ hostvars['runtime_target'].target_state.benchmark_id }}"
  tasks:
    - name: Stop metrics sampler
      ansible.builtin.shell: "pkill -f '[m]etrics_sampler.py' || true"
      changed_when: false
      become: true
    - name: Stop Locust worker processes
      ansible.builtin.shell: "pkill -f '[l]ocust.*--worker' || true"
      changed_when: false
      become: true
      when:
        - inventory_hostname in groups['locust_workers']
        - (target.benchmark_engine | default('locust')) == 'locust'
    - name: Stop any remaining capacity workers
      ansible.builtin.shell: "pkill -f '[c]onnection_capacity.py' || true"
      changed_when: false
      become: true
      when:
        - inventory_hostname in groups['locust_workers']
        - (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Collect capacity coordinator log before stopping coordinator
      ansible.builtin.fetch:
        src: "{{ remote_result_dir }}/capacity-coordinator.log"
        dest: "{{ playbook_dir }}/../results/{{ target.benchmark_id }}/raw/master/capacity-coordinator.log"
        flat: true
        fail_on_missing: false
      become: true
      when:
        - inventory_hostname in groups['master']
        - (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Stop capacity level coordinator
      ansible.builtin.shell: |
        set -euo pipefail
        pid_file=/var/run/octavia-perf-capacity-coordinator.pid
        if [ -s "$pid_file" ]; then
          pid=$(cat "$pid_file")
          if [ -r "/proc/$pid/cmdline" ] && tr '\0' ' ' <"/proc/$pid/cmdline" | grep -Fq /opt/octavia-perf/capacity_coordinator.py; then
            kill "$pid" 2>/dev/null || true
          fi
          rm -f "$pid_file"
        fi
      args:
        executable: /bin/bash
      changed_when: false
      become: true
      when:
        - inventory_hostname in groups['master']
        - (target.benchmark_engine | default('locust')) == 'connection_capacity'
- name: Restore temporary FIP benchmark routes
  hosts: master:locust_workers
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
    route_state_file: "/var/lib/octavia-perf/fip-route-{{ target.target_host }}.json"
  tasks:
    - name: Restore route after floating-IP benchmark
      ansible.builtin.command:
        argv:
          - /opt/octavia-perf/controller_fip_route.py
          - restore
          - --state-file
          - "{{ route_state_file }}"
      become: true
      changed_when: true
      failed_when: false
      when: (target.traffic_path | default('tenant_vip')) == 'floating_ip'
- name: Validate collected connection-capacity results after cleanup
  hosts: localhost
  gather_facts: false
  vars:
    target: "{{ hostvars['runtime_target'].target_state }}"
    local_raw_dir: "{{ playbook_dir }}/../results/{{ target.benchmark_id }}/raw"
    expected_processes: "{{ connection_capacity.processes_per_vm | default(2) | int }}"
  tasks:
    - name: Find collected worker capacity CSV files
      ansible.builtin.find:
        paths: "{{ local_raw_dir }}"
        patterns: "connection-capacity-p*.csv"
        recurse: true
        file_type: file
      register: collected_capacity_csvs
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Require complete distributed connection-capacity measurements
      ansible.builtin.assert:
        that:
          - >-
            (groups['locust_workers'] | map('extract', hostvars, 'capacity_worker_rc') | map('int') | select('ne', 0) | list | length) == 0
          - (collected_capacity_csvs.matched | default(0) | int) == ((groups['locust_workers'] | length) * (expected_processes | int))
        fail_msg: >-
          Capacity run is incomplete: expected_worker_csvs={{ (groups['locust_workers'] | length) * (expected_processes | int) }},
          collected_worker_csvs={{ collected_capacity_csvs.matched | default(0) }}.
          Review orchestration/run_test.log and raw/*/connection-capacity-p*.log and .exitcode files.
      when: (target.benchmark_engine | default('locust')) == 'connection_capacity'
    - name: Verify at least one capacity connection was established
      ansible.builtin.shell: |
        {{ ansible_playbook_python | quote }} - {{ local_raw_dir | quote }} <<'PY'
        import csv
        import pathlib
        import sys
        root = pathlib.Path(sys.argv[1])
        files = sorted(root.glob('*/connection-capacity-p*.csv'))
        if not files:
            raise SystemExit('No distributed capacity CSVs were collected')
        established = 0
        rows = 0
        for path in files:
            with path.open(newline='') as stream:
                for row in csv.DictReader(stream):
                    rows += 1
                    established += int(row.get('established') or 0)
        if not rows or established == 0:
            raise SystemExit(f'No connections established in {len(files)} worker CSVs ({rows} rows)')
        print(f'Capacity data validated: {len(files)} CSVs, {rows} rows, {established} total established observations')
        PY
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - (target.benchmark_engine | default('locust')) == 'connection_capacity'
        - (collected_capacity_csvs.matched | default(0) | int) == ((groups['locust_workers'] | length) * (expected_processes | int))

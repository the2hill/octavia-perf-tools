---
- name: Delete the load balancer under test and ephemeral Barbican secrets
  hosts: localhost
  gather_facts: false
  vars:
    root_dir: "{{ playbook_dir }}/.."
    use_fip: "{{ (benchmark.traffic_path | default('tenant_vip')) == 'floating_ip' }}"
    lb_name: "{{ run_prefix }}-{{ (octavia_flavor | default('default')) | regex_replace('[^A-Za-z0-9_.-]', '-') }}-{{ scenario_name | regex_replace('[^A-Za-z0-9_.-]', '-') }}"
  tasks:
    - name: Delete load balancer and child resources
      openstack.cloud.loadbalancer:
        cloud: "{{ (openstack.cloud | combine({'region_name': openstack.region_name})) if (openstack.cloud is mapping and (openstack.region_name | default(''))) else openstack.cloud }}"
        region_name: "{{ (openstack.region_name | default(omit, true)) if (openstack.cloud is string) else omit }}"
        name: "{{ lb_name }}"
        delete_floating_ip: "{{ use_fip | bool }}"
        state: absent
        wait: true
        timeout: 900
      failed_when: false

    - name: Check per-run secret tracking file
      ansible.builtin.stat:
        path: "{{ root_dir }}/state/current_secrets.yml"
      register: secret_state_file

    - name: Load per-run secret references
      ansible.builtin.include_vars:
        file: "{{ root_dir }}/state/current_secrets.yml"
        name: secret_state
      when: secret_state_file.stat.exists

    - name: Delete ephemeral Barbican secrets after Octavia releases them
      ansible.builtin.command:
        argv:
          - "{{ root_dir }}/.venv/bin/python"
          - "{{ root_dir }}/scripts/barbican_secret.py"
          - delete
          - --cloud
          - "{{ openstack.cloud | to_json }}"
          - --region
          - "{{ openstack.region_name | default('') }}"
          - --ref
          - "{{ item }}"
      loop: "{{ secret_state.secret_refs | default([]) if secret_state_file.stat.exists else [] }}"
      no_log: true
      changed_when: true
      failed_when: false

    - name: Reset per-run secret tracking
      ansible.builtin.copy:
        dest: "{{ root_dir }}/state/current_secrets.yml"
        mode: "0600"
        content: |
          secret_refs: []

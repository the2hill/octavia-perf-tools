---
- name: Reconcile controller route to benchmark master
  hosts: localhost
  gather_facts: false
  vars:
    root_dir: "{{ playbook_dir }}/.."
  tasks:
    - name: Ensure controller can reach current master FIP
      ansible.builtin.include_tasks: tasks/ensure_controller_master_route.yml

- name: Wait for jump host SSH readiness
  hosts: master
  gather_facts: false
  tasks:
    - name: Wait until jump host completes SSH handshakes reliably
      ansible.builtin.wait_for_connection:
        delay: 2
        sleep: 5
        connect_timeout: "{{ ssh.connect_timeout_seconds | default(10) | int }}"
        timeout: "{{ ssh.readiness_timeout_seconds | default(600) | int }}"

- name: Validate jump-host reachability to private SSH endpoints
  hosts: master
  gather_facts: false
  vars:
    private_ssh_targets: "{{ (groups.get('backends', []) + groups.get('locust_workers', [])) | unique }}"
  tasks:
    - name: Wait for TCP/22 from jump host to each private benchmark node
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        connect_timeout: "{{ ssh.connect_timeout_seconds | default(10) | int }}"
        timeout: "{{ ssh.private_tcp_timeout_seconds | default(180) | int }}"
        sleep: 3
        state: started
      loop: "{{ private_ssh_targets }}"
      loop_control:
        label: "{{ item }} -> {{ hostvars[item].ansible_host }}:22"

- name: Wait for private benchmark node SSH readiness
  hosts: backends:locust_workers
  gather_facts: false
  serial: "{{ ssh.readiness_serial | default(2) | int }}"
  tasks:
    - name: Wait until private node is reachable through the jump host
      ansible.builtin.wait_for_connection:
        delay: 2
        sleep: 5
        connect_timeout: "{{ ssh.connect_timeout_seconds | default(10) | int }}"
        timeout: "{{ ssh.readiness_timeout_seconds | default(600) | int }}"

- name: Configure all benchmark nodes
  hosts: benchmark_nodes
  gather_facts: true
  serial: "{{ ssh.configure_serial | default(4) | int }}"
  roles:
    - common

- name: Stabilize dual-homed Locust master routing
  hosts: master
  gather_facts: false
  tasks:
    - name: Keep the master default route on its workload/control NIC
      ansible.builtin.shell: |
        set -euo pipefail
        workload_ip={{ workload_ip | quote }}
        generator_ip={{ generator_ip | quote }}
        if [ "$workload_ip" = "$generator_ip" ]; then
          exit 0
        fi
        workload_if=$(ip -o -4 addr show | awk -v ip="$workload_ip" '$4 ~ ("^" ip "/") {print $2; exit}')
        generator_if=$(ip -o -4 addr show | awk -v ip="$generator_ip" '$4 ~ ("^" ip "/") {print $2; exit}')
        test -n "$workload_if"
        test -n "$generator_if"
        ip -4 route show default dev "$workload_if" | grep -q '^default '
        ip -4 route del default dev "$generator_if" 2>/dev/null || true
        ip -4 route get 1.1.1.1 | grep -q "src $workload_ip"
      args:
        executable: /bin/bash
      become: true
      changed_when: workload_ip != generator_ip

- name: Configure native nginx backends
  hosts: backends
  gather_facts: true
  serial: "{{ ssh.configure_serial | default(4) | int }}"
  roles:
    - backend

- name: Configure Locust master and workers
  hosts: master:locust_workers
  gather_facts: true
  serial: "{{ ssh.configure_serial | default(4) | int }}"
  roles:
    - locust


---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false
  become: true

- name: Refresh apt metadata on Debian-family images
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: Install common packages
  ansible.builtin.package:
    name:
      - python3
      - python3-venv
      - curl
    state: present
  become: true

- name: Create benchmark directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/octavia-perf
    - /var/lib/octavia-perf
    - /var/lib/octavia-perf/results
  become: true

- name: Install low-overhead metrics sampler
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/locust/files/metrics_sampler.py"
    dest: /opt/octavia-perf/metrics_sampler.py
    owner: root
    group: root
    mode: "0755"
  become: true
